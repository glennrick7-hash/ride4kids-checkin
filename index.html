<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>Ride4Kids Check-In</title>

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>

  <style>
    :root {
      --navy: #172c48;
      --orange: #ef7d22;
      --cream: #fff8ef;
      --green: #178a50;
      --red: #b3261e;
      --amber: #9a6400;
      --gray: #667085;
      --border: #d0d5dd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--navy);
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      padding: 24px 16px;
      background: var(--navy);
      color: white;
      text-align: center;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 27px;
    }

    header p {
      margin: 0;
      opacity: 0.9;
    }

    main {
      width: min(100%, 560px);
      margin: 0 auto;
      padding: 18px;
    }

    .card {
      margin-bottom: 16px;
      padding: 18px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 6px 24px rgba(23, 44, 72, 0.1);
    }

    #reader {
      width: 100%;
      min-height: 280px;
      overflow: hidden;
      border-radius: 14px;
      background: #f2f4f7;
    }

    .camera-message {
      margin: 12px 0 0;
      color: var(--gray);
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
      color: var(--gray);
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 18px;
      text-transform: uppercase;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: var(--orange);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .secondary {
      background: var(--navy);
    }

    .loading {
      display: none;
      padding: 16px;
      text-align: center;
      color: var(--gray);
    }

    .result {
      display: none;
      padding: 20px;
      border-radius: 16px;
      text-align: center;
    }

    .result.success {
      display: block;
      color: var(--green);
      background: #eaf8f0;
      border: 2px solid var(--green);
    }

    .result.warning {
      display: block;
      color: var(--amber);
      background: #fff5d8;
      border: 2px solid var(--amber);
    }

    .result.error {
      display: block;
      color: var(--red);
      background: #fdecec;
      border: 2px solid var(--red);
    }

    .icon {
      margin-bottom: 8px;
      font-size: 54px;
    }

    .participant-name {
      margin: 10px 0 14px;
      font-size: 25px;
      font-weight: bold;
    }

    .details {
      padding: 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.7);
      text-align: left;
      line-height: 1.8;
    }

    .payment-paid {
      font-weight: bold;
      color: var(--green);
    }

    .payment-pending {
      font-weight: bold;
      color: var(--amber);
    }

    .payment-cancelled {
      font-weight: bold;
      color: var(--red);
    }

    .help {
      color: var(--gray);
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<header>
  <h1>Ride4Kids Check-In</h1>
  <p>Scan the participant QR code</p>
</header>

<main>

  <section class="card">

    <div id="reader"></div>

    <p
      id="cameraMessage"
      class="camera-message"
    >
      Allow camera access when requested.
    </p>

    <div class="divider">
      or enter manually
    </div>

    <label for="reference">
      Reference number
    </label>

    <input
      id="reference"
      type="text"
      placeholder="R4K-0001"
      autocomplete="off"
      autocapitalize="characters"
    >

    <button
      id="checkInButton"
      type="button"
      onclick="manualCheckIn()"
    >
      Find Participant
    </button>

    <p class="help">
      Open this page directly in Chrome or Safari.
      Camera access may not work inside another app
      or an embedded browser.
    </p>

  </section>


  <div
    id="loading"
    class="loading"
  >
    Looking up participant...
  </div>


  <section
    id="result"
    class="result"
  >
  </section>


  <button
    id="nextButton"
    type="button"
    class="secondary"
    onclick="resetScanner()"
    style="display:none;"
  >
    Scan Next Participant
  </button>

</main>


<script>

  /**************************************************
   * CONFIGURATION
   **************************************************/

  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbyRmTmN0Nk6TgwnrAUhry8QREvBpIkJKOAucJcC6Qy59JupSVtAquSqUuN_04VSeCq-Cw/exec";

  const CHECKIN_KEY =
    "R4K-2026-KCPB-9x4Q7m2L8p6V";

  /*
   * SAFE TEST MODE
   *
   * For now we only LOOK UP riders.
   * Nobody is marked Checked In.
   */
  const API_ACTION =
    "lookup";


  let scanner = null;
  let scanLocked = false;
  let callbackCounter = 0;


  /**************************************************
   * STARTUP
   **************************************************/

  window.addEventListener(
    "load",
    function() {
      startScanner();
    }
  );


  document
    .getElementById(
      "reference"
    )
    .addEventListener(
      "keydown",
      function(event) {

        if (
          event.key ===
          "Enter"
        ) {
          event.preventDefault();

          manualCheckIn();
        }
      }
    );


  /**************************************************
   * EXTRACT R4K REFERENCE
   **************************************************/

  function extractReference(
    qrText
  ) {

    const value =
      String(
        qrText || ""
      ).trim();

    if (!value) {
      return "";
    }


    /*
     * JSON QR payload.
     */
    try {

      const qrData =
        JSON.parse(
          value
        );

      const reference =
        qrData.reference ||
        qrData.ref ||
        qrData.r ||
        "";

      if (reference) {

        const normalized =
          String(
            reference
          )
            .trim()
            .toUpperCase();

        if (
          /^R4K-\d{4,}$/.test(
            normalized
          )
        ) {
          return normalized;
        }
      }

    } catch (error) {
      // Not JSON.
    }


    /*
     * Plain text QR / manual reference.
     */
    const match =
      value
        .toUpperCase()
        .match(
          /R4K-\d{4,}/
        );

    return match
      ? match[0]
      : "";
  }


  /**************************************************
   * CAMERA
   **************************************************/

  function startScanner() {

    const reader =
      document.getElementById(
        "reader"
      );

    reader.innerHTML = "";


    if (
      typeof Html5QrcodeScanner ===
      "undefined"
    ) {

      showError(
        "The QR scanner library could not be loaded."
      );

      return;
    }


    scanLocked = false;


    scanner =
      new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,

          qrbox:
            function(
              viewfinderWidth,
              viewfinderHeight
            ) {

              const minimumDimension =
                Math.min(
                  viewfinderWidth,
                  viewfinderHeight
                );

              const boxSize =
                Math.floor(
                  minimumDimension *
                  0.72
                );

              return {
                width: boxSize,
                height: boxSize
              };
            },

          aspectRatio: 1,

          rememberLastUsedCamera:
            true,

          supportedScanTypes: [
            Html5QrcodeScanType
              .SCAN_TYPE_CAMERA
          ]
        },
        false
      );


    scanner.render(
      onScanSuccess,
      onScanFailure
    );
  }


  function onScanSuccess(
    decodedText
  ) {

    if (scanLocked) {
      return;
    }


    const reference =
      extractReference(
        decodedText
      );


    if (!reference) {

      showError(
        "The QR code does not contain a valid Ride4Kids reference."
      );

      return;
    }


    scanLocked = true;


    document
      .getElementById(
        "reference"
      )
      .value =
        reference;


    stopScanner();

    lookupRider(
      reference
    );
  }


  function onScanFailure(
    errorMessage
  ) {
    /*
     * Normal while camera searches
     * for a QR code.
     */
  }


  function stopScanner() {

    if (!scanner) {
      return;
    }


    scanner
      .clear()
      .catch(
        function(error) {

          console.warn(
            "Scanner cleanup warning:",
            error
          );
        }
      );
  }


  /**************************************************
   * MANUAL LOOKUP
   **************************************************/

  function manualCheckIn() {

    const input =
      document.getElementById(
        "reference"
      );


    const reference =
      extractReference(
        input.value
      );


    if (!reference) {

      showError(
        "Please enter a valid Ride4Kids reference number."
      );

      input.focus();

      return;
    }


    scanLocked = true;

    stopScanner();

    lookupRider(
      reference
    );
  }


  /**************************************************
   * APPS SCRIPT JSONP API
   **************************************************/

  function lookupRider(
    reference
  ) {

    setLoading(
      true
    );


    callbackCounter++;


    const callbackName =
      "ride4kidsCallback_" +
      Date.now() +
      "_" +
      callbackCounter;


    const script =
      document.createElement(
        "script"
      );


    /*
     * Timeout protection.
     */
    const timeoutId =
      setTimeout(
        function() {

          cleanupJsonp(
            callbackName,
            script
          );

          setLoading(
            false
          );

          showError(
            "The Ride4Kids server did not respond. Please try again."
          );

        },
        15000
      );


    /*
     * Apps Script will execute this callback.
     */
    window[
      callbackName
    ] =
      function(result) {

        clearTimeout(
          timeoutId
        );

        cleanupJsonp(
          callbackName,
          script
        );

        setLoading(
          false
        );

        displayResult(
          result
        );
      };


    /*
     * Build API query.
     */
    const query =
      new URLSearchParams({
        action:
          API_ACTION,

        key:
          CHECKIN_KEY,

        value:
          reference,

        callback:
          callbackName,

        timestamp:
          String(
            Date.now()
          )
      });


    script.src =
      APPS_SCRIPT_URL +
      "?" +
      query.toString();


    /*
     * Handle request failure.
     */
    script.onerror =
      function() {

        clearTimeout(
          timeoutId
        );

        const failedUrl =
          script.src;


        cleanupJsonp(
          callbackName,
          script
        );

        setLoading(
          false
        );


        console.error(
          "Ride4Kids API request failed:",
          failedUrl
        );


        showError(
          "Unable to connect to the Ride4Kids server."
        );
      };


    console.log(
      "Ride4Kids API request:",
      script.src
    );


    /*
     * CRITICAL:
     * This actually sends the JSONP request.
     */
    document.body.appendChild(
      script
    );
  }


  function cleanupJsonp(
    callbackName,
    script
  ) {

    try {

      delete window[
        callbackName
      ];

    } catch (error) {

      window[
        callbackName
      ] =
        undefined;
    }


    if (
      script &&
      script.parentNode
    ) {

      script
        .parentNode
        .removeChild(
          script
        );
    }
  }


  /**************************************************
   * DISPLAY RESULT
   **************************************************/

  function displayResult(
    result
  ) {

    const resultBox =
      document.getElementById(
        "result"
      );

    const nextButton =
      document.getElementById(
        "nextButton"
      );


    if (!result) {

      showError(
        "The server returned an empty response."
      );

      return;
    }


    const paymentStatus =
      String(
        result.paymentStatus ||
        "Pending"
      ).trim();


    const paymentClass =
      getPaymentClass(
        paymentStatus
      );


    const paymentMessage =
      getPaymentMessage(
        paymentStatus
      );


    /*
     * Successful lookup.
     */
    if (
      result.success &&
      result.type ===
      "lookup"
    ) {

      resultBox.className =
        "result success";


      resultBox.innerHTML = `

        <div class="icon">
          ✓
        </div>

        <h2>
          Participant Found
        </h2>

        <div class="participant-name">
          ${escapeHtml(
            result.firstName
          )}
          ${escapeHtml(
            result.lastName
          )}
        </div>

        <div class="details">

          <strong>Reference:</strong>
          ${escapeHtml(
            result.reference
          )}
          <br>

          <strong>Distance:</strong>
          ${escapeHtml(
            result.distance ||
            "-"
          )}
          <br>

          <strong>Team:</strong>
          ${escapeHtml(
            result.team ||
            "Individual rider"
          )}
          <br>

          <strong>Jersey size:</strong>
          ${escapeHtml(
            result.jerseySize ||
            "-"
          )}
          <br>

          <strong>Check-In Status:</strong>
          ${escapeHtml(
            result.checkInStatus ||
            "Not Checked In"
          )}
          <br>

          <strong>Payment Status:</strong>

          <span class="${paymentClass}">
            ${escapeHtml(
              paymentStatus
            )}
          </span>

          <br>

          <strong>Payment:</strong>
          ${escapeHtml(
            paymentMessage
          )}

        </div>
      `;


      nextButton.style.display =
        "block";

      return;
    }


    /*
     * API returned an error.
     */
    resultBox.className =
      "result error";


    resultBox.innerHTML = `

      <div class="icon">
        ×
      </div>

      <h2>
        Participant Not Found
      </h2>

      <p>
        ${escapeHtml(
          result.message ||
          "Unable to retrieve participant."
        )}
      </p>
    `;


    nextButton.style.display =
      "block";
  }


  /**************************************************
   * PAYMENT DISPLAY
   **************************************************/

  function getPaymentClass(
    paymentStatus
  ) {

    const status =
      String(
        paymentStatus || ""
      )
        .trim()
        .toLowerCase();


    if (
      status === "paid" ||
      status === "waived"
    ) {

      return "payment-paid";
    }


    if (
      status === "cancelled"
    ) {

      return "payment-cancelled";
    }


    return "payment-pending";
  }


  function getPaymentMessage(
    paymentStatus
  ) {

    const status =
      String(
        paymentStatus ||
        "Pending"
      )
        .trim()
        .toLowerCase();


    if (
      status === "paid"
    ) {

      return "Payment confirmed";
    }


    if (
      status === "waived"
    ) {

      return "Payment waived";
    }


    if (
      status === "cancelled"
    ) {

      return "Registration cancelled";
    }


    return "Payment has not been confirmed";
  }


  /**************************************************
   * UI HELPERS
   **************************************************/

  function showError(
    message
  ) {

    const resultBox =
      document.getElementById(
        "result"
      );


    resultBox.className =
      "result error";


    resultBox.innerHTML = `

      <div class="icon">
        ×
      </div>

      <h2>
        Unable to Continue
      </h2>

      <p>
        ${escapeHtml(
          message
        )}
      </p>
    `;


    document
      .getElementById(
        "nextButton"
      )
      .style.display =
        "block";
  }


  function setLoading(
    isLoading
  ) {

    document
      .getElementById(
        "loading"
      )
      .style.display =
        isLoading
          ? "block"
          : "none";


    document
      .getElementById(
        "checkInButton"
      )
      .disabled =
        isLoading;
  }


  /**************************************************
   * RESET
   **************************************************/

  function resetScanner() {

    scanLocked =
      false;


    document
      .getElementById(
        "result"
      )
      .className =
        "result";


    document
      .getElementById(
        "result"
      )
      .innerHTML =
        "";


    document
      .getElementById(
        "nextButton"
      )
      .style.display =
        "none";


    document
      .getElementById(
        "reference"
      )
      .value =
        "";


    setLoading(
      false
    );


    scanner =
      null;


    startScanner();
  }


  /**************************************************
   * HTML ESCAPE
   **************************************************/

  function escapeHtml(
    value
  ) {

    return String(
      value == null
        ? ""
        : value
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );
  }

</script>

</body>
</html>
